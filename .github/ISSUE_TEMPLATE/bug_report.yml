name: Bug Report
description: Report a diagnostic error or crash
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A flight log holds the GPS track of the flight and the serial number of the flight controller, and so does a report made from it. Attach one only if you are content for both to be public. A traceback, the vehicle type and the firmware version are often enough.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Run `python3 flight_report.py <log>.BIN`
        2. ...
  - type: dropdown
    id: vehicle
    attributes:
      label: Vehicle type
      options:
        - Copter
        - Plane
        - QuadPlane
        - Rover
        - Other
  - type: input
    id: firmware
    attributes:
      label: ArduPilot firmware version
      placeholder: e.g. 4.5.7
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.3
  - type: textarea
    id: log
    attributes:
      label: Error output / traceback
      render: shell
