name: Feature Request
description: Suggest a new analyzer or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ArduScope accepts feature requests; the maintainer schedules them at their discretion, see POSITIONING.md. If the tool got something wrong, that is a defect: please use the bug report form.
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      placeholder: Describe the feature
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why is this useful?
      placeholder: What problem does it solve?
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New analyzer
        - Existing analyzer improvement
        - Report / UI
        - CLI / API
        - Threshold adjustment
        - Other
