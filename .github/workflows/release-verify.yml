name: Release verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.13.2"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/verify_release.py
          ${{ github.event.release.tag_name || inputs.tag }}
