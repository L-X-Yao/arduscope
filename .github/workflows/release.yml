name: Release

on:
  push:
    tags: ["v*"]

# Jobs get this rather than the repository default, so only build, which
# makes the draft release, can write.
permissions:
  contents: read

jobs:
  # The tag is checked before anything runs that builds, the reusable CI
  # included. A malformed tag, one whose commit is not on main, or one whose
  # version is not the tagged commit's ends the run here, with no wheel, no
  # zip and no draft. The version it confirms is passed on to build.
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # All of the history, and every branch: the check places the tagged
      # commit against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Check the release tag
        id: tag
        run: python3 tools/check_release_tag.py

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      # Standalone Windows package (.pyc mode), on the Python named by
      # DEFAULT_PYTHON in build_windows_package.py. The runner Python above has
      # to be the same minor version, so the compiled .pyc runs on it
      # (build_windows_package guards a mismatch). The libraries are the ones
      # pinned in win64-requirements.txt. Output lands in dist/, so the release
      # upload below picks it up.
      - name: Build standalone Windows package
        run: >-
          python build_windows_package.py
          --output arduscope-v${{ needs.validate.outputs.version }}-win64.zip

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          python -c "
          import re, sys
          text = open('CHANGELOG.md').read()
          ver = '${{ needs.validate.outputs.version }}'
          pattern = rf'## \[{re.escape(ver)}\].*?\n(.*?)(?=\n## |\Z)'
          m = re.search(pattern, text, re.DOTALL)
          if m:
              print(m.group(1).strip())
          else:
              print(f'Release v{ver}')
          " > release_notes.md

      # A draft, seen only by the repository's collaborators. It is published
      # once tools/win_package_check.py has passed on its Windows package.
      # The one action from outside GitHub, in the one job that can write, so
      # it is named by commit: its owner can move a tag such as v3.
      - name: Create a draft GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release_notes.md
          files: dist/*
          draft: true
          generate_release_notes: false
